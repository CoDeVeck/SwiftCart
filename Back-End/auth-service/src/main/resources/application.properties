spring.application.name=auth-service

server.port = 8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

#Conexion para MONGO_DB
spring.data.mongodb.uri={SPRING_DATA_MONGODB_URI}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clooudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

#Variblaes de entorno para GitHub
github.clientId = ${CLIENTE_ID_GITHUB}
github.clientSecret = ${CLIENTE_SECRET_GITHUB}

#variables de entorno para Google
google.clientId= ${CLIENTE_ID_GOOGLE}
google.clientSecret = {CLIENTE_SECRET_GOOGLE}

# Variables de entor para KAFKA
spring.kafka.producer.bootstrap-servers = localhost:9092
spring.kafka.producer.key-serializer =  org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.name = auth_service