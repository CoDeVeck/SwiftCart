info:
  name: Registrar_Producto
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8082/v1/catalogo/producto
  body:
    type: multipart-form
    data:
      - name: nombre
        type: text
        value: nuevoProducto
      - name: descripcion
        type: text
        value: nuevitoPapi
      - name: idEmpresa
        type: text
        value: "1"
      - name: idSubCategoria
        type: text
        value: "2"
      - name: multipartFile
        type: file
        value:
          - C:\Users\User\Pictures\images.png
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
