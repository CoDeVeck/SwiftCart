spring.application.name=swiftCart

#Conexion para MONGO_DB
spring.data.mongodb.uri=${SPRING_MONGODB_URI}

#PARA PRODUCCION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Variblaes de entorno para GitHub
github.clientId = ${CLIENTE_ID_GITHUB}
github.clientSecret = ${CLIENTE_SECRET_GITHUB}

#variables de entorno para Google
google.clientId= ${CLIENTE_ID_GOOGLE}
google.clientSecret = {CLIENTE_SECRET_GOOGLE}
#Variblaes de entorno para Cloudinary
cloudinary.name = {CLOUDINARY_NAME}
cloudinary.key = {CLOUDINARY_KEY_KOROFOODS}
cloudinary.secret = {CLOUDINARY_SECRET_KOROFOODS}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB